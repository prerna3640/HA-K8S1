# HPA – Safety Net
# -----------------
# The predictive controller handles proactive scaling.
# This HPA acts as a FALLBACK: it only fires when actual CPU exceeds 70%
# (higher than the predictor's threshold), catching any spikes the ML model missed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # fallback threshold (predictive scaler acts at ~50%)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5-min cooldown on scale-down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
