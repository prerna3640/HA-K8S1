apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
      initContainers:
      - name: init-index
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "<html><head><title>My HA Website</title></head><body>
          <h1>Welcome to my High Availability Kubernetes Site </h1>
          <p>Served from pod: ${POD_NAME}</p>
          </body></html>" > /work-dir/index.html
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: web-content
          mountPath: /work-dir
      volumes:
      - name: web-content
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: myapp
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP

