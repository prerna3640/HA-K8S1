  <line x1="1470" y1="785" x2="1410" y2="785" stroke="#ffd46b" stroke-width="3.5"/>
  <polygon points="1410,785 1442,765 1442,805" fill="#ffd46b"/>
  <text x="1440" y="764" text-anchor="middle" class="label">fallback</text>

  <line x1="1275" y1="730" x2="1275" y2="657" stroke="#ffd46b" stroke-width="3.5"/>
  <polygon points="1275,657 1252,697 1298,697" fill="#ffd46b"/>
  <text x="1325" y="685" class="label">live metrics</text>

  <line x1="1330" y1="870" x2="1330" y2="840" stroke="#49e3a0" stroke-width="3.5"/>
  <polygon points="1330,840 1308,880 1352,880" fill="#49e3a0"/>

  <line x1="1580" y1="442" x2="1590" y2="870" stroke="#6ec2ff" stroke-width="3.5"/>
  <polygon points="1590,870 1568,830 1612,830" fill="#6ec2ff"/>
  <text x="1634" y="668" class="label">alerts</text>

  <text x="90" y="935" class="small">CI tools: GitHub, Jenkins, BuildKit, nerdctl</text>
  <text x="90" y="958" class="small">CD tools: scp, ssh, ctr, kubectl, ArgoCD</text>
  <text x="1050" y="935" class="small">Runtime tools: Prometheus, Grafana, Flask, PyTorch, HPA, Telegram</text>
</svg>
