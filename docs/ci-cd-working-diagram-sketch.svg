<svg width="1800" height="980" viewBox="0 0 1800 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn style CI/CD and Kubernetes scaling diagram</title>
  <desc id="desc">A sketch-style architecture diagram for intelligent auto-scaling in Kubernetes, showing GitHub, Jenkins, image build and deployment, ArgoCD, Prometheus, ML Predictor, Predictive Scaler, Web App, HPA, and Telegram alerts.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17131d"/>
      <stop offset="100%" stop-color="#1d1822"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      text {
        font-family: "Comic Sans MS", "Trebuchet MS", "Segoe UI", sans-serif;
      }
      .title {
        font-size: 34px;
        font-weight: 700;
        fill: #fff8ec;
      }
      .subtitle {
        font-size: 18px;
        fill: #d7d2e6;
      }
      .section {
        font-size: 24px;
        font-weight: 700;
        fill: #fff8ec;
      }
      .white {
        fill: #fff8ec;
      }
      .label {
        font-size: 16px;
        font-weight: 700;
        fill: #fff8ec;
      }
      .small {
        font-size: 15px;
        fill: #f3efe8;
      }
      .cardTitle {
        font-size: 23px;
        font-weight: 700;
        fill: #ffffff;
      }
      .cardText {
        font-size: 16px;
        fill: #ffffff;
      }
      .outline {
        fill: none;
        stroke: rgba(255,255,255,0.22);
        stroke-width: 3;
        stroke-dasharray: 10 10;
      }
      .scribble {
        fill: none;
        stroke: rgba(255,248,236,0.7);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <rect width="1800" height="980" fill="url(#bg)"/>

  <text x="900" y="56" text-anchor="middle" class="title">Intelligent Auto-Scaling in Kubernetes</text>
  <text x="900" y="88" text-anchor="middle" class="subtitle">Hand-drawn view of CI/CD flow and runtime working</text>

  <text x="110" y="145" class="section">CI / CD</text>
  <text x="1040" y="145" class="section">Runtime</text>

  <rect x="50" y="170" width="820" height="730" rx="30" ry="30" class="outline"/>
  <rect x="970" y="170" width="780" height="730" rx="30" ry="30" class="outline"/>

  <path d="M85 205 C120 195, 170 198, 210 205" class="scribble"/>
  <path d="M1000 205 C1060 196, 1140 196, 1210 205" class="scribble"/>

  <!-- Left side nodes -->
  <g filter="url(#softGlow)">
    <rect x="100" y="255" width="190" height="96" rx="26" ry="26" fill="#0d7fe8" stroke="#74b9ff" stroke-width="3"/>
    <path d="M113 268 C153 258, 243 258, 278 269" class="scribble"/>
    <text x="195" y="304" text-anchor="middle" class="cardTitle">GitHub</text>
    <text x="195" y="335" text-anchor="middle" class="cardText">Source Code</text>
  </g>

  <g filter="url(#softGlow)">
    <rect x="390" y="255" width="255" height="96" rx="26" ry="26" fill="#6d4aff" stroke="#8fd3ff" stroke-width="3"/>
    <path d="M407 268 C455 260, 575 260, 625 270" class="scribble"/>
    <text x="518" y="304" text-anchor="middle" class="cardTitle">Jenkins</text>
    <text x="518" y="335" text-anchor="middle" class="cardText">Pipeline</text>
  </g>

  <g filter="url(#softGlow)">
    <rect x="105" y="455" width="235" height="108" rx="24" ry="24" fill="#f4a62a" stroke="#ffd38d" stroke-width="3"/>
    <path d="M120 468 C170 457, 255 458, 325 469" class="scribble"/>
    <text x="223" y="500" text-anchor="middle" class="cardTitle">BuildKit</text>
    <text x="223" y="530" text-anchor="middle" class="cardText">Build Engine</text>
  </g>

  <g filter="url(#softGlow)">
    <rect x="435" y="455" width="235" height="108" rx="24" ry="24" fill="#17b56c" stroke="#8affc0" stroke-width="3"/>
    <path d="M450 468 C515 457, 595 458, 654 469" class="scribble"/>
    <text x="553" y="500" text-anchor="middle" class="cardTitle">nerdctl</text>
    <text x="553" y="530" text-anchor="middle" class="cardText">Build Images</text>
  </g>

  <g filter="url(#softGlow)">
    <rect x="280" y="655" width="360" height="110" rx="28" ry="28" fill="#ff3d7d" stroke="#ff9cbf" stroke-width="3"/>
    <path d="M295 670 C350 658, 555 658, 620 670" class="scribble"/>
    <text x="460" y="700" text-anchor="middle" class="cardTitle">Artifacts</text>
    <text x="460" y="733" text-anchor="middle" class="cardText">Predictor image + Scaler image</text>
  </g>

  <g filter="url(#softGlow)">
