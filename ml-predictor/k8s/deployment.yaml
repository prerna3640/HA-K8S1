apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-predictor
  namespace: monitoring
  labels:
    app: ml-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-predictor
  template:
    metadata:
      labels:
        app: ml-predictor
    spec:
      nodeSelector:
        workload: data
      containers:
        - name: ml-predictor
          image: ml-predictor:v2.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: RETRAIN_INTERVAL_HOURS
              value: "1"
            - name: HISTORY_HOURS
              value: "168"
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
